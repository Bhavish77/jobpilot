[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jobpilot-shared"
version = "0.1.0"
description = "Shared config, DB clients, Celery app, and task definitions for JobPilot's agent-core and job-worker services."
requires-python = ">=3.11"
dependencies = [
    "pydantic-settings>=2.4",
    "celery>=5.4",
    "redis>=5.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "motor>=3.5",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "pyjwt>=2.9",
    "httpx>=0.27",
    "bcrypt>=4.1",
]

[tool.setuptools.packages.find]
include = ["jobpilot_shared*"]
