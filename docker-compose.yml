x-app-env: &app-env
  env_file:
    - .env

services:
  postgres:
    image: postgres:16-alpine
    container_name: jobpilot-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jobpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jobpilot}
      POSTGRES_DB: ${POSTGRES_DB:-jobpilot}
    ports:
      # Overridable per machine — some dev boxes already have a Postgres on
      # 5432 for another project. Set POSTGRES_HOST_PORT in .env to change it.
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jobpilot}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:7
    container_name: jobpilot-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: jobpilot-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: jobpilot-rabbitmq
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  agent-core:
    build:
      context: .
      dockerfile: agent-core/Dockerfile
    container_name: jobpilot-agent-core
    <<: *app-env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  job-worker:
    build:
      context: .
      dockerfile: job-worker/Dockerfile
    container_name: jobpilot-job-worker
    <<: *app-env
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  notify:
    build:
      context: ./notify
    container_name: jobpilot-notify
    <<: *app-env
    ports:
      - "4000:4000"
    depends_on:
      redis:
        condition: service_healthy

volumes:
  pg_data:
  mongo_data:
  redis_data:
  rabbitmq_data:
